[package]
name = "ledgermill"
description = "Portable ledger engine core: loads journals from memory and answers through typed values."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["finance", "parser-implementations"]
# The integration tests read ../../spec, so they cannot run from the packaged crate.
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# Forks without GPL files, pinned by commit. Their types stay inside src/beancount/lima.rs.
beancount-parser-lima = { git = "https://github.com/srod/beancount-parser-lima", rev = "cac6939619536557c72a7fe91a346eb69199f3c5", version = "0.16" }
limabean-booking = { git = "https://github.com/srod/limabean-booking", rev = "1984ed762ba38acb65881cd5e579830c5c930a43", version = "0.10", default-features = false, features = ["rust-decimal"] }
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
regex-lite = "0.1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
