[package]
name = "ledgermill"
description = "Portable ledger engine core: loads journals from memory and answers through typed values."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["finance", "parser-implementations"]
# The integration tests read ../../spec, so they cannot run from the packaged crate.
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# Our forks without GPL files, pinned by commit, published on crates.io under our names (the
# published crate takes them from there, by version). Their types stay inside src/beancount/lima.rs.
beancount-parser-lima = { package = "ledgermill-beancount-parser", git = "https://github.com/srod/beancount-parser-lima", rev = "b4ffc56e37ce82e1f4155f7848c9cf8cc217b468", version = "=0.16.3" }
# A fast hasher for the maps of a load (SipHash was ~4% of it); already in the tree via chumsky.
foldhash = "0.1"
limabean-booking = { package = "ledgermill-beancount-booking", git = "https://github.com/srod/limabean-booking", rev = "00ffbda3b29c6486281748bcdb1d2f4bf307aa03", version = "=0.10.5", default-features = false, features = ["rust-decimal"] }
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
regex-lite = "0.1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
