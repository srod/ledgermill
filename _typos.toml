# typos: spelling in code, spec notes and docs.
# Journals and the period-expression corpus are test data with made-up words on purpose, so they are not checked.
[files]
extend-exclude = ["*.journal", "LICENSE-*", "spec/hledger/period-forms.txt"]

[default]
# The 6-character transaction ids that open the rows in spec notes are hashes, not words.
extend-ignore-re = ["(?m)^[0-9a-f]{6},"]

[default.extend-words]
# The ordinal ending of `2nd` in period expressions.
nd = "nd"
# `P1 ... Pn`: the account patterns of a query in spec/hledger/holdings.md.
Pn = "Pn"
