name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130
  # Brotli-compressed wasm, in bytes.
  WASM_SIZE_BUDGET: 1500000

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain from Cargo.toml
        run: |
          msrv=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^rust-version = "\(.*\)"$/\1/p;}' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ env.MSRV }}
      - run: cargo +${{ env.MSRV }} check --workspace --locked

  # Dependency licences and advisories (deny.toml), unused dependencies, spelling (_typos.toml).
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: bnjbvr/cargo-machete@v0.9.2
      - uses: crate-ci/typos@v1.51.1
      - run: scripts/no-private-tracker-ids.sh

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Cache wasm-bindgen-cli
        id: wasm-bindgen-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      # Also checks version sync across Cargo.toml, ledgermill-wasm/Cargo.toml, package.json and Cargo.lock.
      - run: crates/ledgermill-wasm/build.sh

      - name: Size budget
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli
          size=$(brotli -q 11 -c pkg/ledgermill_wasm_bg.wasm | wc -c)
          echo "wasm size, brotli -q 11: $size bytes (budget $WASM_SIZE_BUDGET)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$WASM_SIZE_BUDGET" ]; then
            echo "::error::wasm is over the size budget"
            exit 1
          fi

      - uses: ./.github/actions/reference-tools
      - run: bun crates/ledgermill-wasm/smoke.ts
      - run: bun test harness/
      - run: bun harness/compare.ts --quiet
      - name: Random journals
        run: bun harness/fuzz.ts 1000 "$GITHUB_RUN_NUMBER"
      - name: Random networks of prices
        run: bun harness/fuzz.ts --graph 300 "$GITHUB_RUN_NUMBER"
      - name: Random Beancount journals
        run: bun harness/fuzz.ts --beancount 150 "$GITHUB_RUN_NUMBER"
      - name: Random Beancount journals, pairs priced both ways
        run: bun harness/fuzz.ts --both-ways 40 "$GITHUB_RUN_NUMBER"
      - name: Random sets of several ledgers (Beancount files, Beancount with hledger)
        run: bun harness/fuzz.ts --multi 60 "$GITHUB_RUN_NUMBER"
      - name: Stress test (100,000 transactions per format)
        run: bun harness/stress.ts

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-ios -p ledgermill --locked

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Point cargo at the preinstalled NDK
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - run: cargo build --release --target aarch64-linux-android -p ledgermill --locked

  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off and names no private tracker id
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            commits=$(git log --no-merges --format=%H "$PR_BASE..$PR_HEAD")
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$PUSH_BEFORE" ]; then
            # A new branch: every commit it has that the default branch does not.
            commits=$(git log --no-merges --format=%H "$PUSH_AFTER" --not "origin/$DEFAULT_BRANCH")
          else
            commits=$(git log --no-merges --format=%H "$PUSH_BEFORE..$PUSH_AFTER")
          fi
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          status=0
          for commit in $commits; do
            git show -s --format=%B "$commit" > "$tmp"
            if ! grep -Eq '^Signed-off-by: .+ <.+>$' "$tmp"; then
              echo "::error::commit $commit has no Signed-off-by line (use git commit -s)"
              status=1
            fi
            if ! scripts/no-private-tracker-ids.sh "$tmp"; then
              echo "::error::commit $commit names a private tracker id"
              status=1
            fi
          done
          exit $status
