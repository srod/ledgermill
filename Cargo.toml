[workspace]
members = ["crates/ledgermill", "crates/ledgermill-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/srod/ledgermill"
homepage = "https://github.com/srod/ledgermill"
readme = "README.md"
# Lowest compiler checked: `cargo +1.88.0 check --workspace --locked` (the `time` crate needs 1.88).
rust-version = "1.88"
keywords = ["ledger", "accounting", "hledger", "beancount", "wasm"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
missing_docs = "deny"

# Adopted from the Apollo Rust handbook; see AGENTS.md "Rust style".
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
needless_collect = "deny"
cast_possible_truncation = "deny"
unused_self = "deny"
needless_pass_by_ref_mut = "deny"
