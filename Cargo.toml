[workspace]
members = ["crates/ledgermill", "crates/ledgermill-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/srod/ledgermill"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
