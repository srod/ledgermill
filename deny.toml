# cargo-deny: dependency licences, security advisories, bans and sources.
# Run: cargo deny check

[graph]
# Check every target we ship to, not just the host.
targets = [
  "wasm32-unknown-unknown",
  "aarch64-apple-ios",
  "aarch64-linux-android",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
all-features = true

[licenses]
# Only permissive licences (and MPL-2.0, which is file-level copyleft). No GPL, LGPL or AGPL:
# ledgermill must stay usable in app stores and closed-source apps.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9
# The list above is a policy, not an inventory: entries no dependency uses yet are fine.
unused-allowed-license = "allow"

[licenses.private]
# Our own unpublished crates (publish = false) are checked by their declared licence too.
ignore = false

[advisories]
# Fail on any known vulnerability, and warn about unmaintained or yanked crates.
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only; a git dependency (e.g. our future fork of the Beancount crates) must be
# added here explicitly.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
